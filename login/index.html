<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart Barn — Club Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2F7D42; --green-dark:#1F5C2E;
    --text:#292929; --text-soft:#666666;
    --bg:#FFFFFF; --bg-soft:#F2F7F3; --border:#DDE5DD;
    --error:#B3261E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg-soft); color:var(--text);
    font-family:'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1{ font-weight:800; color:var(--green-dark); font-size:22px; margin-bottom:6px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:36px 32px; max-width:380px; width:100%; }
  .logo-lockup{ display:flex; align-items:center; gap:9px; margin-bottom:24px; text-decoration:none; }
  .brand{ font-size:17px; font-weight:800; color:var(--green-dark); }
  p.sub{ color:var(--text-soft); font-size:14.5px; margin-bottom:22px; line-height:1.5; }
  label{ display:block; font-size:13px; font-weight:700; color:var(--text-soft); margin-bottom:5px; }
  input{
    width:100%; padding:11px 12px; border-radius:6px; border:2px solid var(--border);
    font-size:16px; font-family:inherit; color:var(--text); background:#fff;
  }
  input:focus{ outline:none; border-color:var(--green); }
  .hint{ font-size:12.5px; color:var(--text-soft); margin-top:6px; }
  button{ width:100%; margin-top:18px; padding:12px; border:none; border-radius:6px; background:var(--green); color:#fff; font-size:15.5px; font-weight:700; font-family:inherit; cursor:pointer; }
  button:hover{ background:var(--green-dark); }
  button:disabled{ opacity:0.6; }
  .error{ display:none; color:var(--error); font-size:13.5px; margin-top:10px; background:#FCEAE9; padding:9px 11px; border-radius:6px; }
  .error.show{ display:block; }
  .foot{ margin-top:22px; padding-top:18px; border-top:1px solid var(--border); font-size:13.5px; color:var(--text-soft); text-align:center; }
  .foot a{ color:var(--green); font-weight:700; text-decoration:none; }

  /* Preview card, shown after a club ID is found */
  .preview{ display:none; text-align:center; }
  .preview.show{ display:block; }
  .preview img{ width:78px; height:78px; border-radius:10px; object-fit:cover; margin-bottom:14px; border:1px solid var(--border); }
  .preview .clubname{ font-size:18px; font-weight:800; color:var(--green-dark); margin-bottom:4px; }
  .preview .confirm{ font-size:14px; color:var(--text-soft); margin-bottom:18px; }
  .preview button.secondary{ background:#fff; color:var(--text-soft); border:2px solid var(--border); margin-top:8px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo-lockup">
    <svg width="26" height="26" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="48" height="48" rx="10" fill="#2F7D42"/>
      <path d="M10 21 L24 9 L38 21" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24" cy="31.5" r="8" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M24 25.5 L24 37.5 M18 31.5 L30 31.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="brand">Cart Barn</span>
  </div>

  <div id="lookupBlock">
    <h1>Sign in to your club</h1>
    <p class="sub">Enter your club ID to continue. It's in your welcome email, or just bookmark this page's result for next time.</p>

    <form id="courseForm">
      <label for="courseId">Club ID</label>
      <input type="text" id="courseId" placeholder="e.g. pineridge" autocapitalize="off" autocorrect="off" autocomplete="off">
      <div class="error" id="errorMsg"></div>
      <button type="submit" id="lookupBtn">Continue</button>
    </form>
  </div>

  <div class="preview" id="previewBlock">
    <img id="previewLogo" src="" alt="">
    <div class="clubname" id="previewName"></div>
    <div class="confirm">Is this your club?</div>
    <button onclick="goToApp()">Yes, continue to sign in</button>
    <button class="secondary" onclick="resetLookup()">Not my club — try again</button>
  </div>

  <div class="foot">New to Cart Barn? <a href="/#pricing">See pricing</a></div>
</div>

8PalfNegpFZk8AAAAASUVORK5CYII=";
  let foundSlug = "";

  window.resetLookup = function(){
    document.getElementById('lookupBlock').style.display = 'block';
    document.getElementById('previewBlock').classList.remove('show');
    document.getElementById('courseId').value = '';
    document.getElementById('courseId').focus();
  };

  window.goToApp = function(){
    window.location.href = '/app/?course=' + encodeURIComponent(foundSlug);
  };

  document.getElementById('courseForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const input = document.getElementById('courseId');
    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('lookupBtn');
    const slug = input.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');

    errorMsg.classList.remove('show');
    if (!slug) {
      errorMsg.textContent = "Enter your club ID to continue.";
      errorMsg.classList.add('show');
      return;
    }

    btn.disabled = true; btn.textContent = "Looking up...";
    try {
      const snap = await getDoc(doc(db, "courses", slug));
      if (!snap.exists()) {
        errorMsg.textContent = "We couldn't find a club with that ID. Check with your manager, or sign up if you're new.";
        errorMsg.classList.add('show');
        btn.disabled = false; btn.textContent = "Continue";
        return;
      }
      const data = snap.data();
      foundSlug = slug;
      document.getElementById('previewLogo').src = data.logoUrl || DEFAULT_LOGO;
      document.getElementById('previewName').textContent = data.name || slug;
      document.getElementById('lookupBlock').style.display = 'none';
      document.getElementById('previewBlock').classList.add('show');
    } catch (err) {
      errorMsg.textContent = "Something went wrong looking that up — try again.";
      errorMsg.classList.add('show');
    }
    btn.disabled = false; btn.textContent = "Continue";
  });
</script>
